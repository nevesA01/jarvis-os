[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-agent"
version = "0.2.0"
description = "Agente local seguro do Jarvis para Windows 11"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<45",
  "PyYAML>=6.0,<7",
  "websockets>=13,<16",
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
