[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-agent"
version = "0.1.0"
description = "Núcleo seguro e sem automação da Fase A do Jarvis Local Agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<45",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
